[package]
name = "aleph0hypervisor"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# The ExitBootServices test harness (docs/RESIDENT.md, `cargo build -p
# ebs-harness`) and the OS loader (docs/LINUX_GUEST.md, `cargo build -p
# os-loader`), each its own EFI application, and the UART driver all three
# print with (`crates/uart`, `cargo test -p uart`). Cargo commands run at the
# root still act on Aleph0 alone.
[workspace]
members = ["crates/uart", "tools/ebs-harness", "tools/os-loader"]

[dependencies]
uart = { path = "crates/uart" }
uefi = "0.40"

# Switches for the Hyper-V runner (`-Features`, `-TestGuest`); all are off by
# default. A default build virtualizes the running firmware in place.
[features]
# Run the built-in test guest instead: the regression mode, with its scripted
# VMCALLs, teardown and the return to firmware outside VMX operation.
test-guest = []
# The exit handler reads a non-canonical address at the first exit, so the
# host IDT's #GP handler prints the fault and halts.
host-fault-test = []
# The exit handler waits in root operation after main VMCALL #1, so the
# `-InjectNmi` NMI reaches the host NMI handler instead of the guest.
host-nmi-test = ["test-guest"]
# At the first exit under Hyper-V, forward an RDMSR and a WRMSR of
# 0x4000FFFF, which Hyper-V refuses: shows the host fault handler resuming
# a refused forward (docs/HYPERV_INTERFACE.md section 5).
forward-refusal-test = []
# Print every VM exit in full, with no rate limit (vmexit/policy.rs).
trace-exits = []
# Expect the wrong RAX at main VMCALL #1, so the guest stops there as an
# unexpected exit: the stop report and teardown of a stop nobody planned.
unexpected-exit-test = ["test-guest"]
# Treat XSETBV as an exit Aleph0 does not handle. Only an OS kernel runs it,
# so `-Kernel` stops in the runtime phase: the stop report on COM2 and a
# halted VM, with nothing to return to.
os-stop-test = []
# Make the Local APIC's PDPT entry W without R, so the guest's read of it is
# an EPT misconfiguration: the stop, and the walk that names the entry.
ept-misconfig-test = ["test-guest"]
